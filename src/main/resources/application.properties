spring.application.name=totp-2fa-demo

# Name shown in Microsoft Authenticator next to the account
app.totp.issuer=MyApp

# 32-byte AES key, Base64-encoded, used to encrypt TOTP secrets at rest.
# Generate one with:  openssl rand -base64 32
# NEVER commit a real key: set it via the APP_TOTP_ENCRYPTION_KEY environment variable in production.
app.totp.encryption-key=${APP_TOTP_ENCRYPTION_KEY:q3J8m0Yp1vN4c7Xr2Tg6Lw9Zs5Hb8Kd1Fe3Ua6Ri0Oo=}

# Demo database (in-memory)
spring.datasource.url=jdbc:h2:mem:demo
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Session cookie hardening
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
